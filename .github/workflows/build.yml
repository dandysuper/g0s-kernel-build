name: Build g0s kernel (LineageOS 24.0 + KernelSU Next + BCM4389 Wi-Fi)

on:
  workflow_dispatch:
  push:
    paths: ['**.py', '**.sh', '.github/workflows/build.yml']
  pull_request:
    paths: ['**.py', '**.sh', '.github/workflows/build.yml']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install shell and image verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck mksh busybox cpio lz4 erofs-utils
      - name: Host-safe regressions and shell checks
        run: |
          python3 -m unittest discover -s tests -v
          LOAD_DRIVERS_TEST_SHELL=mksh python3 -m unittest discover -s tests -p test_load_drivers.py -q
          LOAD_DRIVERS_TEST_SHELL='busybox ash' python3 -m unittest discover -s tests -p test_load_drivers.py -q
          shellcheck -s sh load_drivers.sh
          sh -n load_drivers.sh
          sh -n tests/probe_android_lock.sh
          git diff --check

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    concurrency:
      group: g0s-kernel-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: g0s
      KBUILD_BUILD_HOST: github-actions
      KBUILD_BUILD_VERSION: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: '1'
      # The old next branch is gone; v3.4.2 is UAPI 5, not UAPI 6.
      KSU_REF: b427a3f9c2421a443f961007bfce66b25486643f

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout kernel source
        run: |
          set -e
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/ExtremeXT/android_kernel_samsung_s5e9925.git kernel
          cd kernel
          echo "HEAD: $(git log -1 --oneline)"
          {
            echo "VERSION=$(make -s kernelversion)"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "KBUILD_BUILD_TIMESTAMP=$(git show -s --format=%cD HEAD)"
          } >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache cpio curl flex \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev liblz4-tool lz4 lzop \
            python3 rsync xz-utils zip unzip zlib1g-dev kmod device-tree-compiler

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: g0s-ccache-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            g0s-ccache-v1-${{ runner.os }}-${{ github.ref_name }}-
            g0s-ccache-v1-${{ runner.os }}-

      - name: Fetch clang toolchain
        run: |
          set -e
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang-prebuilt
          echo "$PWD/clang-prebuilt/bin" >> "$GITHUB_PATH"
          "$PWD/clang-prebuilt/bin/clang" --version
          ccache --max-size=1G
          ccache --zero-stats

      - name: Apply KernelSU Next
        run: |
          set -e
          cd kernel
          curl --fail --location --show-error --retry 3 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/$KSU_REF/kernel/setup.sh" \
            --output "$RUNNER_TEMP/setup-ksu.sh"
          bash "$RUNNER_TEMP/setup-ksu.sh" "$KSU_REF"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_REF"
          grep -Eq 'KERNEL_SU_UAPI_VERSION[[:space:]]*=[[:space:]]*6;' KernelSU-Next/uapi/supercall.h
          test -f drivers/kernelsu/Kconfig

      - name: Configure (g0s, not r11s)
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/../clang-prebuilt/bin:$PATH"

          # Keep compiler probes consistent across every Kconfig invocation.
          # This Samsung tree has no LTO choice; KASAN caused the measured bloat.
          MAKE_ARGS=(O=out "CC=ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-)

          make -j"$(nproc)" "${MAKE_ARGS[@]}" s5e9925_defconfig

          scripts/kconfig/merge_config.sh -m -O out \
            out/.config arch/arm64/configs/g0s.config

          # KernelSU on, CMUCAL debug off.
          #
          # drivers/soc/samsung/cal-if has a guard mismatch between the header
          # and the implementation:
          #   cmucal.h        declares cmucal_dbg_set_cmu_*_base() and
          #                   vclk_debug_init() extern when
          #                   CONFIG_DEBUG_FS && CONFIG_CMUCAL_DEBUG
          #   vclk.h          declares vclk_debug_init() extern when
          #                   CONFIG_CMUCAL_DEBUG
          #   cmucal-debug.c  DEFINES all of them only inside
          #                   CONFIG_DEBUG_FS && CONFIG_CMUCAL_DEBUG
          # CMUCAL_DEBUG is "tristate ... default y", so the externs appear while
          # the definitions do not land in cmupmucal.ko, and modpost dies with:
          #   "vclk_debug_init"             [..../cmupmucal.ko] undefined!
          #   "cmucal_dbg_set_cmu_top_base" [..../cmupmucal.ko] undefined!
          # With CMUCAL_DEBUG off every one of those declarations becomes a
          # static inline stub, so the module carries no external debug symbols
          # at all and links cleanly. The only loss is the debugfs clock tree.
          # DEBUG_FS itself stays on - it is standard and other subsystems use it.
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable DEBUG_FS
          scripts/config --file out/.config --disable CMUCAL_DEBUG
          scripts/config --file out/.config --disable CMUCAL_DEBUG_MODULE

          # ---------------------------------------------------------------------
          # Size: KASAN and DEBUG_INFO are what made the module set unfittable.
          # ---------------------------------------------------------------------
          # Measured against the stock ExtremeKRNL build:
          #   stock Image   28,965,376   our Image   53,348,864   (1.84x)
          #   stock modules 58,998,976   our modules 113,854,768  (1.93x)
          #   stock .data in dhd.ko 125,720 | ours 1,252,832 (10x, plus a
          #   .rela.data section stock does not have at all)
          #
          # The cause is not LTO - this tree has no LTO choice in init/Kconfig
          # at all, so CONFIG_LTO_CLANG_THIN can never be selected here. The
          # real cause is that the merged config enables:
          #
          #   CONFIG_KASAN=y + CONFIG_KASAN_HW_TAGS=y
          #     Instruments every load and store (code bloat, ~1.8x) and puts
          #     redzones around every global (the 10x .data and the extra
          #     .rela.data relocations). This is a debug-only feature that is
          #     genuinely active here, not a build artefact.
          #   CONFIG_DEBUG_INFO=y + CONFIG_DEBUG_INFO_DWARF4=y
          #     Builds with -g, adding full DWARF to every module.
          #
          # Either one alone breaks the budget; vendor_dlkm is a fixed
          # 19,685,376-byte partition and our set compressed to 30,330,880.
          # Both off returns Image and modules to the stock footprint.
          scripts/config --file out/.config --disable KASAN
          scripts/config --file out/.config --disable KASAN_GENERIC
          scripts/config --file out/.config --disable KASAN_HW_TAGS
          scripts/config --file out/.config --disable KASAN_SW_TAGS
          scripts/config --file out/.config --disable KASAN_INLINE
          scripts/config --file out/.config --disable DEBUG_INFO
          scripts/config --file out/.config --enable DEBUG_INFO_NONE
          scripts/config --file out/.config --disable INIT_ON_ALLOC_DEFAULT_ON
          scripts/config --file out/.config --disable INIT_ON_FREE_DEFAULT_ON
          scripts/config --file out/.config --enable CC_OPTIMIZE_FOR_PERFORMANCE
          scripts/config --file out/.config --disable CC_OPTIMIZE_FOR_SIZE

          make -j"$(nproc)" "${MAKE_ARGS[@]}" olddefconfig

          # PSI/cgroups/uclamp underpin Android LMKD and task profiles; keep
          # those runtime mechanisms instead of replacing them with boot tweaks.
          for symbol in MACH_G0S_EUR_OPENX CC_IS_CLANG LD_IS_LLD CC_OPTIMIZE_FOR_PERFORMANCE \
              PSI MEMCG MEMCG_SWAP CGROUPS CPUSETS UCLAMP_TASK UCLAMP_TASK_GROUP \
              BPF_SYSCALL BPF_JIT_ALWAYS_ON CGROUP_BPF MODULES MODVERSIONS; do
            grep -qx "CONFIG_${symbol}=y" out/.config || {
              echo "FATAL: required Android/g0s config CONFIG_${symbol}=y missing"; exit 1;
            }
          done

          # If KASAN survives, the build is ~2x too big and the modules will not
          # fit. Fail here in 5 minutes rather than 90 minutes later.
          if grep -qE "^CONFIG_KASAN(=y|=m)" out/.config; then
            echo "FATAL: KASAN still enabled - Image and modules will not fit"
            grep -E "^CONFIG_KASAN" out/.config || true
            exit 1
          fi
          if grep -qE "^CONFIG_DEBUG_INFO=y" out/.config; then
            echo "FATAL: DEBUG_INFO still enabled - modules will carry full DWARF"
            exit 1
          fi
          echo "Size flags OK: KASAN off, DEBUG_INFO off, optimize=performance"

          echo "================ FINAL CONFIG (critical symbols) ================"
          grep -E "CONFIG_BCM4389|CONFIG_BCMDHD_PCIE|CONFIG_R11S_WIRELESS|CONFIG_BT_BCM43XX|CONFIG_KSU|CONFIG_DEBUG_FS|CONFIG_CMUCAL_DEBUG|CONFIG_MODULES|CONFIG_MODVERSIONS" out/.config | sort || true
          echo "================================================================"

          # Hard gates — fail fast instead of shipping a broken kernel
          grep -q "^CONFIG_BCM4389=m"        out/.config || { echo "FATAL: CONFIG_BCM4389=m missing"; exit 1; }
          grep -q "^CONFIG_BCMDHD_PCIE=y"    out/.config || { echo "FATAL: CONFIG_BCMDHD_PCIE=y missing"; exit 1; }
          grep -q "^CONFIG_BT_BCM43XX=m"     out/.config || { echo "FATAL: CONFIG_BT_BCM43XX=m missing"; exit 1; }
          grep -q "^CONFIG_KSU=y"            out/.config || { echo "FATAL: CONFIG_KSU=y missing"; exit 1; }
          grep -q "^CONFIG_DEBUG_FS=y"       out/.config || { echo "FATAL: CONFIG_DEBUG_FS=y missing"; exit 1; }
          if grep -qE "^CONFIG_CMUCAL_DEBUG(=y|=m)" out/.config; then
            echo "FATAL: CMUCAL_DEBUG is on - cmucal_dbg_* / vclk_debug_init will be undefined"; exit 1
          fi
          if grep -q "^CONFIG_R11S_WIRELESS=y" out/.config; then
            echo "FATAL: r11s wireless enabled on a g0s build"; exit 1
          fi
          echo "All config gates passed."

      - name: Build kernel image and modules
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export PATH="$PWD/../clang-prebuilt/bin:$PATH"
          MAKE_ARGS=(O=out "CC=ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-)
          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image
          ls -lh out/arch/arm64/boot/Image

      - name: Build modules
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export PATH="$PWD/../clang-prebuilt/bin:$PATH"
          MAKE_ARGS=(O=out "CC=ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-)
          make -j"$(nproc)" "${MAKE_ARGS[@]}" modules
          rm -rf ../modules_out
          make -j"$(nproc)" "${MAKE_ARGS[@]}" \
            INSTALL_MOD_PATH="$PWD/../modules_out" \
            modules_install

          # INSTALL_MOD_STRIP=1 does nothing useful here: with STRIP=llvm-strip
          # the kernel build passes the value through as a strip argument, and
          # modules came out of modules_install at full size - measured
          # 113,854,768 bytes, identical to unstripped. Strip explicitly.
          # --strip-debug removes only DWARF and leaves .symtab and the .modinfo
          # vermagic section alone, so module loading is unaffected.
          find ../modules_out -name '*.ko' -print0 \
            | xargs -0 -r llvm-strip --strip-debug

          MCOUNT=$(find ../modules_out -name '*.ko' | wc -l)
          MBYTES=$(find ../modules_out -name '*.ko' -printf '%s\n' | awk '{s+=$1} END {print s}')
          DHD=$(find ../modules_out -name 'dhd.ko' | head -1)
          echo "modules: $MCOUNT"
          echo "bytes:   $MBYTES"
          echo "dhd.ko:  $(stat -c%s "$DHD") bytes"
          echo "vermagic in dhd.ko: $(strings "$DHD" | grep -c '^vermagic=')"

          # The stock module set is 57 MB here and compresses to 19,079,168
          # bytes. Anything near double that will not fit the 19,685,376-byte
          # vendor_dlkm partition, so fail now rather than during repack.
          if [ "$MBYTES" -gt 70000000 ]; then
            echo "FATAL: stripped modules still $MBYTES bytes - will not fit vendor_dlkm"
            exit 1
          fi

      - name: Verify vermagic and required modules
        run: |
          set -e
          cd kernel
          echo "kernelversion: $(make kernelversion)"

          # The kernel and every module must agree exactly, or the ROM refuses to
          # load the module set at boot and the device comes up with no Wi-Fi.
          KVM=$(strings out/arch/arm64/boot/Image | grep -m1 -E "^5\.10\.[0-9]+")
          SAMPLE=$(find ../modules_out -name '*.ko' | head -1)
          MVM=$(strings "$SAMPLE" | sed -n 's/^vermagic=//p' | head -1)
          echo "kernel vermagic : $KVM"
          echo "module vermagic : $MVM   ($SAMPLE)"

          [ -n "$KVM" ] || { echo "FATAL: no vermagic in Image"; exit 1; }
          [ -n "$MVM" ] || { echo "FATAL: no vermagic in $SAMPLE"; exit 1; }

          # The Image carries the bare release (5.10.260-g<hash>[-dirty]) while a
          # module carries that release followed by its flags
          # ("... SMP preempt mod_unload modversions aarch64"). Equality is the
          # wrong comparison - the module string must START WITH the release.
          case "$MVM" in
            "$KVM"*) echo "vermagic OK - module vermagic is prefixed by the kernel release" ;;
            *) echo "FATAL: vermagic mismatch - kernel '$KVM' is not a prefix of module '$MVM'"; exit 1 ;;
          esac

          for m in dhd.ko cfg80211.ko bcm43xx.ko; do
            path=$(find ../modules_out -name "$m" | head -1)
            if [ -z "$path" ]; then
              echo "FATAL: required module $m missing from the build"; exit 1
            fi
            echo "present: $m  ($(stat -c%s "$path") bytes)"
          done

      - name: Package artifacts
        run: |
          set -e
          cd kernel
          mkdir -p ../artifact
          cp out/arch/arm64/boot/Image ../artifact/Image
          tar -C ../modules_out -czf ../artifact/modules.tar.gz .
          cd ../artifact
          ls -lh
          echo "$(date -u +%Y%m%d-%H%M)" > build-stamp.txt

      # Artifact storage is quota-limited account-wide and that quota is spent,
      # so upload-artifact fails with "Artifact storage quota has been hit".
      # Release assets are metered separately, so the build publishes itself as
      # a release instead. Tag carries the build timestamp so every build lands
      # without clobbering the previous one.
      - name: Publish build as a release
        run: |
          set -e
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          NOTES="$PWD/artifact/release-notes.md"
          {
            echo "LineageOS 24.0 / Android 17 kernel for g0s (Galaxy S22)."
            echo ""
            echo "- kernel: $VERSION"
            echo "- KernelSU Next: enabled"
            echo "- BCM4389 Wi-Fi (BCMDHD_PCIE) + BCM BT (BCM43XX): enabled"
            echo "- r11s wireless: rejected by config gate"
            echo "- CONFIG_CMUCAL_DEBUG disabled: fix for the cmupmucal.ko"
            echo "  undefined cmucal_dbg_set_cmu_*_base / vclk_debug_init symbols"
            echo ""
            echo "Assets:"
            echo "- Image: raw arm64 kernel"
            echo "- modules.tar.gz: lib/modules tree from modules_install"
          } > "$NOTES"
          echo "Published tag: $TAG"
          gh release create "$TAG" \
            artifact/Image \
            artifact/modules.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "g0s kernel $TAG" \
            --notes-file "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
